# ADSIM calculation parameters file header (need to add disclaimer and license)
# ADSIM_version = "2025 v0.x.x"
# File_created = "2025-11-28"

[units]
geometry_unit = "m"
mass_unit = "kg"
pressure_unit = "kPa"
temperature_unit = "K"
time_unit = "s"

[gravity]
gravity_magnitude = 9.81
gravity_x_component = 0.0
gravity_y_component = -1.0

[solver]
solver_type = "2D-Plane"
diffusion = 1
advection = 1
gravity = 0
reaction_kinetics = 0

[time_stepping]
total_simulation_time = 14400
time_per_step = 600
# calculate_critical_time_step takes min(dt_diffusion, dt_advection), each derived as
# if its term acted alone. For a single gas the advective flux is itself diffusion-like,
# so the two operators add: D/tau = 1.6e-5 and R*T*K*C/(mu*theta_g) sum to an effective
# diffusivity whose Fourier number exceeded 0.5 at courant 0.8, which is what produced
# the NaN at step 30. The Courant number is reduced to keep the COMBINED operator stable.
courant_number = 0.15

[data_saving]
data_saving_interval = 1.0

[probing]
# Nodes to follow during simulation
number_of_nodes = 0
nodes_to_probe = []

# Elements to follow during simulation (data at Gaussian points)
number_of_elements = 0
elements_to_probe = []

