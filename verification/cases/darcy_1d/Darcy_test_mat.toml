# ADSIM material file header (need to add disclaimer and license)
# ADSIM_version = "2025 v0.1.0"
# File_created = "2026-08-13"

gas_dictionary_ = ["CO2"]
soil_dictionary_ = ["Soil 1"]

# Gas properties
[gas."CO2"]
dynamic_viscosity = 1e-5
molar_mass = 0.044
diff_coefficient = 1.6e-5

# Liquid properties
[liquid]
dynamic_viscosity = 1e-5
density = 1000
specific_heat = 1.0

# Reactant properties (reaction disabled for this test)
[reactants]
reaction_enthalpy = -113800.0
lime_arrhenius_factor = 0.0
lime_activation_energy = 0.0

# Soil properties
[soil."Soil 1"]
# Physical properties
specific_gravity = 2.65
porosity = 1.0
saturation = 0.0
granular_tortuosity = 1.0
# Permeability is the property under test: v = (K/mu) * grad P.
# Sized so the Darcy velocity stays well above numerical noise while keeping
# the explicit CFL time step reasonable (dt ~ 50 s for this mesh).
intrinsic_permeability = 1.6e-16
# Thermal properties
specific_heat_solids = 1.0

# Reaction properties (unused; no lime)
[reaction."Soil 1"]
lime_content = 0.0
residual_lime = 0.0
