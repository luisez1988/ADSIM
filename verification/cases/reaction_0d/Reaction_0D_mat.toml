# ADSIM material file - reaction_0d verification case
# ADSIM_version = "2025 v0.1.0"
#
# Isothermal by construction: reaction_enthalpy = 0 so the reaction releases no
# heat, dT/dt stays zero and the rate coefficient is constant. That is what makes
# the closed-form DoC(t) = (1 - p_r)(1 - exp(-lambda t)) exact for this case.
# Do not give this case a nonzero enthalpy without also giving it a thermal
# boundary condition - the reference stops being valid the moment T moves.

gas_dictionary_ = ["CO2"]
soil_dictionary_ = ["Soil 1"]

# Gas properties
[gas."CO2"]
dynamic_viscosity = 1.48e-5
molar_mass = 0.04401
diff_coefficient = 1.6e-5

# Liquid properties
[liquid]
dynamic_viscosity = 1e-3
density = 1000
specific_heat = 4184.0

# Reactant properties
[reactants]
reaction_enthalpy = 0.0
lime_arrhenius_factor = 1.0e-3
lime_activation_energy = 0.0
lime_interfacial_area_beta = 0.0

# Soil properties
[soil."Soil 1"]
# Physical properties
specific_gravity = 2.65
porosity = 0.474
saturation = 0.3
granular_tortuosity = 1.5
intrinsic_permeability = 1e-15
# Thermal properties
specific_heat_solids = 800.0

# Reaction properties
[reaction."Soil 1"]
lime_content = 0.1
residual_lime = 0.1
