# ADSIM calculation parameters file header (need to add disclaimer and license)
# ADSIM_version = "2025 v0.1.0"
# File_created = "2026-08-13"

[units]
geometry_unit = "m"
mass_unit = "kg"
pressure_unit = "kPa"
temperature_unit = "K"
time_unit = "s"

[gravity]
gravity_magnitude = 9.81
gravity_x_component = 0.0
gravity_y_component = -1.0

[solver]
time_integration = "IMPES"
# With the pressure feedback made implicit the species step is advection dominated,
# so streamline upwinding is not optional here. See src/IMPES_FORMULATION_NOTES.md.
advection_stabilization = 1
solver_type = "2D-Axisymmetric"
diffusion = 0
advection = 1
gravity = 0
reaction_kinetics = 0

[time_stepping]
total_simulation_time = 60000
time_per_step = 6000
courant_number = 0.8

[data_saving]
data_saving_interval = 1.0

[probing]
# Nodes to follow during simulation
number_of_nodes = 0
nodes_to_probe = []

# Elements to follow during simulation (data at Gaussian points)
number_of_elements = 0
elements_to_probe = []
