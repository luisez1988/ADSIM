# ADSIM calculation parameters file header (need to add disclaimer and license)
# ADSIM_version = "2025 v0.x.x"
# File_created = "2025-11-28"

[units]
geometry_unit = "m"
mass_unit = "kg"
pressure_unit = "kPa"
temperature_unit = "K"
time_unit = "s"

[gravity]
gravity_magnitude = 9.81
gravity_x_component = 0.0
gravity_y_component = -1.0

[solver]
time_integration = "IMPES"
# With the pressure feedback made implicit the species step is advection dominated,
# so streamline upwinding is not optional here. See src/IMPES_FORMULATION_NOTES.md.
advection_stabilization = 1
solver_type = "2D-Axisymmetric"
diffusion = 1
advection = 1
gravity = 0
reaction_kinetics = 0
heat_conduction = 0
heat_advection = 0

[time_stepping]
total_simulation_time = 2000
time_per_step = 250
# The corrected stability criteria are stable to C_N = 1; 0.9 leaves a margin. The
# solution is time-converged: C_N = 0.3 and C_N = 0.9 give the same profile.
courant_number = 0.9

[data_saving]
data_saving_interval = 250.0

[probing]
# This case is a spatial profile, so it is scored from the VTK snapshots.
number_of_nodes = 0
nodes_to_probe = []

number_of_elements = 0
elements_to_probe = []
