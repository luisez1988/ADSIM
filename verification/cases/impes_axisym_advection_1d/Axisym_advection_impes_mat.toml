# ADSIM material file - advection_1d verification case
#
# TWO gases, with matched transport properties. Both choices are required, not
# cosmetic:
#   dynamic_viscosity equal  - mu is weighted by concentration, so unequal values
#                              make mu drift as CO2 displaces air, and v drifts with
#                              it, which is the very thing this case must avoid.
#   diff_coefficient equal   - unequal values let the TOTAL concentration develop
#                              structure of its own as the species separate,
#                              perturbing the pressure gradient that sets v.
#
# The permeability is chosen so the 1000 Pa drop across the column gives the target
# Darcy flux: K = v mu L / dp = 8e-5 * 1.48e-5 * 1 / 1000 = 1.184e-12 m2.

gas_dictionary_ = ["Air", "CO2"]
soil_dictionary_ = ["Soil 1"]

# Gas properties
[gas."Air"]
dynamic_viscosity = 1.48e-5
molar_mass = 0.02896
diff_coefficient = 1.6e-5
thermal_conductivity = 0.026
molar_heat_capacity = 29.1

[gas."CO2"]
dynamic_viscosity = 1.48e-5
molar_mass = 0.04401
diff_coefficient = 1.6e-5
thermal_conductivity = 0.0166
molar_heat_capacity = 37.1

# Liquid properties
[liquid]
dynamic_viscosity = 1e-3
density = 1000
specific_heat = 4184.0
thermal_conductivity = 0.6

# Reactant properties (the reaction is off in this case)
[reactants]
reaction_enthalpy = 0.0
lime_arrhenius_factor = 0.0
lime_activation_energy = 0.0
lime_interfacial_area_beta = 0.0

# Soil properties
[soil."Soil 1"]
# Physical properties
specific_gravity = 2.65
porosity = 0.5
saturation = 0.0
granular_tortuosity = 1.0
intrinsic_permeability = 1.184e-12
# Thermal properties
specific_heat_solids = 800.0
thermal_conductivity_solids = 2.0

# Reaction properties (no lime)
[reaction."Soil 1"]
lime_content = 0.0
residual_lime = 0.0
